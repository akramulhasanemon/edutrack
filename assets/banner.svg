<svg fill="none" viewBox="0 0 850 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .box {
          width: 850px;
          height: 220px;
          background: linear-gradient(135deg, #050A14 0%, #0A192F 50%, #0D2142 100%);
          border-radius: 16px;
          border: 1px solid rgba(56, 189, 248, 0.25);
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 50px rgba(14, 165, 233, 0.08);
          position: relative;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          box-sizing: border-box;
        }
        .aura {
          position: absolute;
          width: 340px;
          height: 160px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(37, 99, 235, 0.05) 60%, transparent 100%);
          top: -20px;
          left: 50%;
          transform: translateX(-50%);
          filter: blur(40px);
          animation: pulse 4s ease-in-out infinite alternate;
        }
        @keyframes pulse {
          0% { transform: translateX(-50%) scale(0.95); opacity: 0.6; }
          100% { transform: translateX(-50%) scale(1.15); opacity: 1; }
        }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          background: rgba(14, 165, 233, 0.1);
          border: 1px solid rgba(56, 189, 248, 0.35);
          padding: 4px 12px;
          border-radius: 9999px;
          color: #38BDF8;
          font-size: 11px;
          font-weight: 600;
          letter-spacing: 1px;
          text-transform: uppercase;
          margin-bottom: 8px;
        }
        .title {
          font-size: 44px;
          font-weight: 800;
          letter-spacing: -0.5px;
          margin: 0;
          background: linear-gradient(90deg, #FFFFFF 0%, #BAE6FD 30%, #38BDF8 70%, #60A5FA 100%);
          background-size: 200% auto;
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: shine 5s linear infinite;
        }
        @keyframes shine {
          0% { background-position: 0% center; }
          100% { background-position: 200% center; }
        }
        .desc {
          font-size: 14px;
          color: #94A3B8;
          margin-top: 6px;
          font-weight: 500;
        }
        .wave {
          position: absolute;
          bottom: 0;
          left: 0;
          width: 100%;
          height: 36px;
          opacity: 0.6;
        }
      </style>
      <div class="box">
        <div class="aura"></div>
        <div class="badge">Academic Intelligence &amp; Trajectory Engine</div>
        <h1 class="title">🎓 EduTrack</h1>
        <div class="desc">Next-Gen Desktop Platform for Academic Modeling &amp; Workspaces</div>
        <svg class="wave" viewBox="0 0 1200 120" preserveAspectRatio="none">
          <path d="M0,20 C200,80 450,10 600,60 C750,110 1000,30 1200,50 L1200,120 L0,120 Z" fill="rgba(56, 189, 248, 0.2)"></path>
        </svg>
      </div>
    </div>
  </foreignObject>
</svg>
