<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <linearGradient id="edubg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14" />
      <stop offset="50%" stop-color="#081B33" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="edutitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#38BDF8;#60A5FA;#FFFFFF" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#60A5FA;#FFFFFF;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#FFFFFF;#38BDF8;#60A5FA" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="eduwave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>
    <filter id="eduaura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-size: 46px; font-weight: 800; letter-spacing: -0.5px; }
    .badge { font-size: 11px; font-weight: 700; fill: #38BDF8; letter-spacing: 1.5px; }
    .sub { font-size: 15px; fill: #94A3B8; font-weight: 500; }
  </style>

  <rect width="848" height="218" x="1" y="1" rx="16" fill="url(#edubg)" stroke="#1E3A8A" stroke-width="1.5" />

  <circle cx="425" cy="40" r="90" fill="#38BDF8" opacity="0.12" filter="url(#eduaura)">
    <animate attributeName="r" values="70;110;70" dur="4s" repeatCount="indefinite" />
  </circle>

  <g transform="translate(255, 24)">
    <rect width="340" height="26" rx="13" fill="#0E294B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="13" r="4" fill="#38BDF8" />
    <text x="32" y="17" class="sans badge">ACADEMIC INTELLIGENCE &amp; TRAJECTORY ENGINE</text>
  </g>

  <text x="425" y="105" text-anchor="middle" class="sans title" fill="url(#edutitle)">🎓 EduTrack</text>
  <text x="425" y="138" text-anchor="middle" class="sans sub">Next-Generation Desktop Platform for Academic Trajectory &amp; Workspaces</text>

  <path d="M0,200 C200,185 400,215 600,195 C750,180 800,205 850,195 L850,220 L0,220 Z" fill="url(#eduwave)" />
</svg>
